#:schema $schema
# utavideo sample が作った見本の設定。曲名・人・URL はすべて架空です（素材の出所は README.md）。
# 全項目の説明:
# https://github.com/ngtkana/utavideo/blob/main/docs/config-reference.md

[song]
title = "$title"
slug = "$slug"
artist = "$artist"          # 原曲の人（歌った人は [[credits]] に書く）
label = "$label"
original_urls = ["https://example.com/original"]

[audio]
file = "$audio"

[inst]
# 歌唱練習用の動画（utavideo inst）用の音源。声を抜いた伴奏の代わりに、聞き分けやすいサイン波を使う
audio = "$inst_audio"

[video]
# "$still"（4:3 の静止画）・"$gif"（GIF）に書き換えると、他の形式の背景も試せる
background = "$background"
size = [$width, $height]
fps = $fps
crf = $crf
preset = "$preset"
# 4:3 の "$still" に差し替えると、"cover" は上下が切り取られ、"contain" は左右に余白が出る
fit = "cover"
scale_flags = "lanczos"

[lyrics]
file = "src/lyrics.ass"
fade_ms = [150, 150]

[[layers]]
# 背景の上に重ねる素材（画像・GIF・アルファ付き動画）の見本。半透明の帯を右上に、5〜25 秒だけ出す
name = "logo"
file = "$logo"
start = "0:05"
end = "0:25"
anchor = "top-right"
margin = [40, 40]
layer = 50

[avatar]
# ブルーバックの見本（合成、青一色の上を白い図形が動く）。sync = "auto" は録画の音声（見本の
# 音源をわざと遅らせて仕込んである）と audio.file の相互相関で、実際に頭出しのズレを求める
file = "$avatar"
key = "0x0000ff"
sync = "auto"
scale = 0.5
anchor = "bottom-right"
margin = [20, 0]
layer = 60

[overlay_text]
style = "Title"
text = "$overlay_text"

[description]
# タイトルはふつうユーザー設定の description.title から組み立てますが、その形も、{singers} に
# 入る人を決める singer_roles も、人によって違います。見本は誰が動かしても同じ出力になるように、
# タイトルをここに書いています（自分の曲では消して、ユーザー設定に任せて構いません）
title = "$title / $artist（Cover: $singer）"
text = """
utavideo の動作確認用の見本です。
"""
hashtags = ["utavideo", "見本"]

[[credits]]
roles = ["Vocal", "Mix"]
name = "$singer"
urls = ["https://example.com/singer"]

[[credits]]
roles = ["イラスト"]
name = "架空イラストレーター"
urls = ["https://example.com/illustrator"]

# files には背景を3つとも書いてある（background を書き換えても check の警告が増えないように）
[[materials]]
section = "使用素材"
urls = ["https://example.com/material"]
files = ["$background", "$still", "$gif"]
