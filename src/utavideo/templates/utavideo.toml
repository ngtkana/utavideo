# utavideo の設定。全項目の説明:
# https://github.com/ngtkana/utavideo/blob/main/docs/config-reference.md
# パスはこのファイルからの相対パス。

[song]
title = $title
# フォルダ名・ファイル名に使う識別子。曲名を直してもファイル名が変わらないよう、分けてある
slug = $slug
artist = $artist
label = ""                 # チャンネル名など。曲名表示に使う
original_urls = []         # 原曲の URL（概要欄に使う）

[audio]
# 音源。ファイル名の "vX.Y" が release のバージョンになる
file = $audio

[video]
background = $background  # 画像 / GIF / 動画（GIF と動画は繰り返す）
size = [1920, 1080]        # src/lyrics.ass の PlayRes と同じにする
fps = 30
crf = 18
fit = "cover"              # cover: はみ出しを切る / contain: 余白を pad_color で埋める
focus = [0.5, 0.5]         # 縦横比が違う背景のどこを残すか（[横, 縦] を 0〜1。[0, 0] は左上）
scale_flags = "lanczos"    # ドット絵をくっきり拡大するなら "neighbor"

[lyrics]
file = "src/lyrics.ass"
fade_ms = [150, 150]       # \fad が無い行に自動で付ける（[0, 0] で付けない）

[overlay_text]
# 動画全体に出す曲名表示。{title} {artist} {label} が使える
# 改行は \N（TOML では "\\N" と書く）。例: text = "{label}\\N{title} / {artist}"
style = "Title"
text = "{title} / {artist}"

[[thumbnails]]
# サムネイル（utavideo thumbnail → build/thumbnail/main.png）。サイズ違いは [[thumbnails]] を並べる
name = "main"
file = "src/thumbnail.ass"  # 文字を組む .ass（Aegisub で編集）
# size = [1080, 1080]      # 省略時は video.size
# at = "1:23.5"            # 背景が GIF・動画のとき、使うフレームの時刻（省略時は 0）
# focus = [0.5, 0.5]       # 省略時は video.focus

# [vertical]
# 縦型のショート（utavideo vertical-ass が本編の歌詞から縦用 .ass を作る）
# size = [1080, 1920]
# lyrics = "src/vertical.ass"
# focus = [0.5, 0.5]       # 省略時は video.focus

# [[shorts]]
# 区間は縦用 .ass に、スタイル Short のコメント行で置き、本文を name と同じにする
# name = "chorus"

[description]
# 概要欄とタイトル（utavideo description）。見出しなどの書式はユーザー設定で変える
text = """
"""
hashtags = $hashtags  # 先頭の # は付けない
# title = "..."            # 自動で作るタイトルを使わないとき

# 概要欄のクレジット。roles が同じ人は1つの見出しにまとめる
${credits}# [[credits]]
# roles = ["Vocal", "Mix"]
# name = "名前"
# urls = ["https://..."]

# 使った素材。files はその素材を使ったファイル（check でクレジットの書き忘れを見つける）
# [[materials]]
# section = "イラスト"
# urls = ["https://..."]
# files = ["src/bg/background.png"]
